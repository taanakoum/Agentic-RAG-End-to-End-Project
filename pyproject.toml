[project]
name = "agentic-rag-platform"
version = "0.1.0"
description = "Production-grade async multi-user Agentic RAG platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "psycopg[binary]==3.3.8",
    "alembic==1.20.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "celery[redis]==5.7.0",
    "redis==8.1.0",
    "qdrant-client==1.20.0",
    "structlog==26.1.0",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "email-validator==2.3.0",
    "pyotp==2.10.0",
    "cryptography==50.0.2",
    "boto3==1.43.126",
    "pypdf==7.0.0",
    "pypdfium2==5.15.1",
    "rapidocr==3.10.0",
    "onnxruntime==1.31.1",
    "pillow==13.0.0",
    "python-multipart==0.0.33",
    "fastembed==0.9.1",
    "docling",
    "langchain-text-splitters",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx2==2.16.0",
    "celery-types==0.26.0",
    "ruff==0.17.4",
    "pyright==1.1.414",
    "aiosmtpd==1.4.6",
    "types-boto3[s3]==1.43.126",
    "moto[s3,server]==5.2.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs real PostgreSQL/Redis/Qdrant (native dev services or Docker)",
    "real_model: downloads and runs the real embedding models (slow, needs network on first run)",
    "docling: runs the Docling pipeline (loads layout models; ~20 s per document)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend"]
extend-exclude = ["backend/migrations/versions", ".claude", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"evaluation/**" = ["E501", "S311"]  # data-heavy scripts; non-cryptographic RNG
"backend/tests/**" = ["S101", "S105", "S106", "RUF001"]  # asserts, fake secrets, intentional Unicode inputs

[tool.pyright]
include = ["backend"]
exclude = ["backend/migrations/versions"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
extraPaths = ["backend"]

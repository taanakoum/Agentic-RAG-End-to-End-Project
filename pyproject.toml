[project]
name = "agentic-rag-platform"
version = "0.1.0"
description = "Production-grade async multi-user Agentic RAG platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "psycopg[binary]==3.3.8",
    "alembic==1.20.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "celery[redis]==5.7.0",
    "redis==8.1.0",
    "qdrant-client==1.20.0",
    "structlog==26.1.0",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "email-validator==2.3.0",
    "pyotp==2.10.0",
    "cryptography==50.0.2",
    "boto3==1.43.126",
    "pypdf==7.0.0",
    "pypdfium2==5.15.1",
    "rapidocr==3.10.0",
    "onnxruntime==1.31.1",
    "pillow==13.0.0",
    "python-multipart==0.0.33",
    "fastembed==0.9.1",
    "python-docx==1.2.0",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "docling",
    "langchain-text-splitters",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg-pool>=3.3.3",
    "httpx==0.28.1",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-instrumentation-celery>=0.66b2",
]

[project.optional-dependencies]
frontend = [
    "segno==1.6.6",
    "streamlit==1.67.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx2==2.16.0",
    "celery-types==0.26.0",
    "ruff==0.17.4",
    "pyright==1.1.414",
    "aiosmtpd==1.4.6",
    "types-boto3[s3]==1.43.126",
    "moto[s3,server]==5.2.5",
    "locust==2.47.0",
    "pytest-cov==7.1.0",
]

[tool.uv]
package = false

# Linux (the container) uses PyTorch's CPU-only wheels: the default PyPI wheel drags in several GB
# of CUDA libraries that Docling's CPU inference never uses. Windows already gets the CPU build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs real PostgreSQL/Redis/Qdrant (native dev services or Docker)",
    "real_model: downloads and runs the real embedding models (slow, needs network on first run)",
    "docling: runs the Docling pipeline (loads layout models; ~20 s per document)",
    "real_llm: calls a REAL free hosted model (needs REAL_LLM_* env vars; skipped otherwise)",
    "unit: no external services (everything under backend/tests/unit)",
    "e2e: a complete user workflow through the real stack (API, worker, stores, frontend)",
    "security: authentication, authorization, isolation, injection, privacy, abuse limits",
    "concurrency: races, simultaneous users, locks, idempotency, quotas",
    "failure: dependency outages, crashes, timeouts, recovery",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend", "."]
extend-exclude = ["backend/migrations/versions", ".claude", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"evaluation/**" = ["E501", "S311"]  # data-heavy scripts; non-cryptographic RNG
"load_testing/**" = ["E501", "S105", "S311"]  # benchmark script: fake password, random think time
"backend/tests/**" = ["S101", "S105", "S106", "RUF001"]  # asserts, fake secrets, intentional Unicode inputs

[tool.pyright]
include = ["backend", "frontend", "evaluation", "load_testing", "scripts"]
exclude = [
    "backend/migrations/versions",
    "scripts/browser_tour.py",  # needs Playwright, which is deliberately not a project dependency
]
pythonVersion = "3.13"
typeCheckingMode = "strict"
extraPaths = ["backend", "."]

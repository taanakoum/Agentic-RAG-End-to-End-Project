[project]
name = "agentic-rag-platform"
version = "0.1.0"
description = "Production-grade async multi-user Agentic RAG platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "psycopg[binary]==3.3.8",
    "alembic==1.20.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "celery[redis]==5.7.0",
    "redis==8.1.0",
    "qdrant-client==1.20.0",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx2==2.16.0",
    "celery-types==0.26.0",
    "ruff==0.17.4",
    "pyright==1.1.414",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs real PostgreSQL/Redis/Qdrant (native dev services or Docker)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend"]
extend-exclude = ["backend/migrations/versions", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "S105", "S106"]  # asserts and obviously-fake test secrets

[tool.pyright]
include = ["backend"]
exclude = ["backend/migrations/versions"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
extraPaths = ["backend"]
